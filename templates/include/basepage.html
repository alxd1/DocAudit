<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}DocAudit{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', path='/bootstrap/bootstrap.css') }}">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', path='/styles/main.css') }}">

    {% block styles %}
    {% endblock %}
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Header -->
    {% include "include/header.html" %}

    <!-- Main content -->
    <main class="container flex-grow-1 py-4">
        {% block content %}
        
        {% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="{{ url_for('static', path='/bootstrap/bootstrap.js') }}"></script>

    <!-- Custom JS -->
    <script src="{{ url_for('static', path='/scripts/main.js') }}"></script>

    {% block scripts %}
    {% endblock %}
</body>
</html>
